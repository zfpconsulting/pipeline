name: Testy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test ikon
        run: node tests/icons.run.mjs
      - name: Testy kalkulačky a editoru fotek
        run: node tests/fincalc.run.mjs
      - name: Testy důchodové kalkulačky
        run: node tests/duchod.run.mjs
      - name: Testy souborů u klientů (docs.js)
        run: node tests/docs.run.mjs
      - name: Testy asistenta (jádro)
        run: node tests/assistant.run.mjs
      - name: Testy v prohlížeči
        run: node tests/run.mjs
        env:
          PP_KEY: ${{ secrets.PP_KEY }}
